
<!DOCTYPE html>
<html lang="en">

<head>
  <title></title>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta http-equiv="Expires" content="0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Cache-control" content="no-cache">
  <meta http-equiv="Cache" content="no-cache">
  <script src="static/config.js"></script>
  <script src="static/chatbot.js"></script>
  <link rel="icon" href="<%= BASE_URL %>favicon.ico">
  <link rel="stylesheet" href="./static/iconfont/iconfont.css">
  <style>
    /* 在这里直接写Loading的样式 */
    #app-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      flex-direction: column;
      align-items: center;
      background: rgba(159, 207, 242, 0.95); /* 白色半透明蒙版 */
      z-index: 9999;
    }
    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #f3f3f3;
      border-top: 5px solid #3498db; /* 蓝色 */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <noscript>
    <strong>We're sorry but P8 doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
  </noscript>
  <div id="app-loading">
    <div class="loading-spinner"></div>
    <div>正在加载,请稍等...</div>
  </div>
  <div id="app"></div>
  <!-- built files will be auto injected -->
</body>
<script> document.title = 'P8V3.0-PLATFORM' </script>

</html>
