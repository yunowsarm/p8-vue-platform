<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>
<!-- This will not be inserted -->
<div class="mceTmpl">
  <table style="border-collapse: collapse; width: 100%; height: 40px; float: none; margin-left: auto; margin-right: auto;" border="1">
    <tbody>
    <tr style="height: 20px;">
      <td style="width: 32.9297%; height: 20px; text-align: center;">序号</td>
      <td style="width: 33.0167%; height: 20px; text-align: center;">名称</td>
      <td style="width: 33.0167%; height: 20px; text-align: center;">描述</td>
    </tr>
    <tr :key="index" v-for="(t, index) in templateValue.detail" style="height: 20px;">
      <td style="width: 32.9297%; height: 20px; text-align: center;">{{ index }}</td>
      <td style="width: 33.0167%; height: 20px; text-align: center;">{{ t.name }}</td>
      <td style="width: 33.0167%; height: 20px; text-align: center;">{{ t.note }}</td>
    </tr>
    </tbody>
  </table>
</div>
</body>
</html>
